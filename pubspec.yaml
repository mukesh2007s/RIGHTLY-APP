name: rightly
description: "Rightly — AI Legal Awareness Assistant. A premium, futuristic Flutter mobile application for legal assistance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  
  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  
  # UI & Animations
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  
  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Gemini AI
  google_generative_ai: ^0.4.6
  
  # URL Launcher
  url_launcher: ^6.3.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  get_it: ^8.0.2
  
  # Fonts
  google_fonts: ^6.2.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Animations
  animated_text_kit: ^4.2.3
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
